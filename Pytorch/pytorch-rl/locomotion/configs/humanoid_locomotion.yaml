experiment:
  name: humanoid_locomotion_ppo
  seed: 1234
  source_sim: mujoco
  target_sims:
    - newton
    - isaac

assets:
  robot_root: assets/robots/humanoid
  urdf: assets/robots/humanoid/urdf/humanoid.urdf
  mjcf: assets/robots/humanoid/mjcf/humanoid.xml
  meshes: assets/robots/humanoid/meshes

env:
  episode_length_seconds: 20.0
  control_dt: 0.02
  physics_dt: 0.002
  action_type: joint_position_targets
  observation:
    include_previous_action: true
    include_command: true

commands:
  forward_velocity_range: [0.0, 1.0]
  lateral_velocity_range: [0.0, 0.0]
  yaw_velocity_range: [-0.5, 0.5]

policy:
  hidden_dim: 256
  hidden_layers: 2
  activation: tanh
  init_log_std: -1.0

ppo:
  num_envs: 64
  rollout_steps: 128
  total_updates: 5000
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  actor_lr: 0.0003
  critic_lr: 0.001
  entropy_coef: 0.001
  value_coef: 0.5
  max_grad_norm: 1.0
  update_epochs: 5
  minibatches: 4

reward:
  velocity_tracking: 1.0
  lateral_velocity_penalty: 0.2
  yaw_tracking: 0.5
  action_penalty: 0.001
  action_rate_penalty: 0.01
  joint_velocity_penalty: 0.0001
  fall_penalty: 5.0

export:
  directory: exports
  checkpoint_directory: checkpoints

